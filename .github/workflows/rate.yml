# Rates the matches waiting in the SokkerScore database. Started by the database itself the moment a match is queued
# (ss_start_worker in backend/sql/001_schema.sql calls GitHub's workflow_dispatch), by hand from the Actions tab, and every
# five minutes as a safety net (GitHub may start scheduled runs late or not at all).
# Needs two repository secrets: SUPABASE_URL and SUPABASE_SERVICE_KEY.
name: Rate queued matches

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: rate-queue          # one run at a time; a new one waits for the running one
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Is anything waiting?
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::The secrets SUPABASE_URL and SUPABASE_SERVICE_KEY are not set yet: nothing to do."
            echo "waiting=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          out=$(curl -sS --fail "$SUPABASE_URL/rest/v1/ss_matches?select=match_id&status=in.(queued,rating)&limit=1" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          n=$(printf '%s' "$out" | grep -c match_id || true)
          echo "waiting=$n" >> "$GITHUB_OUTPUT"
          echo "matches waiting: $n"
      - uses: actions/checkout@v4
        if: steps.queue.outputs.waiting != '0'
      - uses: actions/setup-python@v5
        if: steps.queue.outputs.waiting != '0'
        with:
          python-version: '3.14'
          cache: pip
      - name: Install numpy
        if: steps.queue.outputs.waiting != '0'
        run: pip install -r requirements.txt
      - name: Rate
        if: steps.queue.outputs.waiting != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -X utf8 -I backend/worker/rate_queue.py
